<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — API Key</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e4e6eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e3a;
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: rgba(80,200,120,0.12);
    color: #50C878;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .role { color: #8b909e; font-size: 14px; margin-bottom: 28px; }
  .key-box {
    background: #12141a;
    border: 1px dashed #3a3f4d;
    border-radius: 12px;
    padding: 16px;
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 13px;
    color: #c5c8d4;
    word-break: break-all;
    line-height: 1.5;
    margin-bottom: 16px;
    user-select: all;
  }
  button {
    width: 100%;
    background: #50C878;
    color: #0f1115;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  button.copied { background: #2a2e3a; color: #50C878; }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #5a6070;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">INTM Studio</div>
    <h1>Admin</h1>
    <div class="role">Master Admin Key</div>
    <div class="key-box" id="key">initium-admin-HcoKqXpjM0JadpP2b8HsIF5Cf-qfiaJS</div>
    <button id="copyBtn" onclick="copyKey()">Tap to Copy</button>
    <div class="hint">Key copied to clipboard. Paste into app settings.</div>
  </div>
  <script>
    function copyKey() {
      const key = document.getElementById('key').innerText;
      const btn = document.getElementById('copyBtn');

      function flashCopied() {
        const original = btn.innerText;
        btn.innerText = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.innerText = original; btn.classList.remove('copied'); }, 2000);
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          flashCopied();
        } catch (e) {
          btn.innerText = 'Copy failed';
          setTimeout(() => { btn.innerText = 'Tap to Copy'; }, 2000);
        }
        document.body.removeChild(ta);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(key).then(flashCopied).catch(() => fallbackCopy(key));
      } else {
        fallbackCopy(key);
      }
    }
  </script>
</body>
</html>
