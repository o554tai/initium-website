<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Editor — INITIUM</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text2: #a0a0a0;
    --accent: #50C878;
    --topbar-h: 52px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

  .topbar {
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .topbar .brand svg { width: 26px; height: 26px; border-radius: 7px; }
  .topbar .badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(80,200,120,0.12);
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .topbar .back {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .topbar .back:hover { color: var(--text); }

  .frame-wrap {
    flex: 1;
    position: relative;
    background: var(--bg);
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .fallback {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
  }
  .fallback p { color: var(--text2); font-size: 14px; max-width: 320px; line-height: 1.5; }
  .fallback .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="agent-hub.html">&#x2190; Agent Hub</a>
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#50C878"/><path d="M30 70V30h8v32h24V30h8v40H30z" fill="#000"/></svg>
      OpenCut
      <span class="badge">Beta</span>
    </div>
    <div style="width:70px;"></div>
  </div>
  <div class="frame-wrap">
    <iframe id="editor" src="https://opencut.app" title="OpenCut Video Editor" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"></iframe>
    <div class="fallback" id="fallback">
      <p>Your browser blocked the embedded editor. Open it directly instead.</p>
      <a class="btn" href="https://opencut.app" target="_blank" rel="noopener">Open OpenCut &rarr;</a>
    </div>
  </div>
</div>

<script>
  const iframe = document.getElementById('editor');
  const fallback = document.getElementById('fallback');
  // If iframe fails to load (X-Frame-Options), show fallback after timeout
  iframe.addEventListener('error', () => { fallback.style.display = 'flex'; iframe.style.display = 'none'; });
  setTimeout(() => {
    try {
      // Accessing contentWindow cross-origin will throw; if it doesn't, frame loaded
      const cw = iframe.contentWindow;
      if (!cw || cw.location.href === 'about:blank') {
        fallback.style.display = 'flex'; iframe.style.display = 'none';
      }
    } catch(e) {
      // Cross-origin means it loaded from a different domain — that's expected
    }
  }, 4000);
</script>
</body>
</html>
